syntax = "proto3";

package comcast.agent.v1;

import "buf/validate/validate.proto";

// Audio codec and framing parameters.
message AudioCodecSpec {
  // Supported audio codecs.
  enum AudioCodec {
    AUDIO_CODEC_UNSPECIFIED = 0;

    // G.711 u-law, 8kHz/8-bit/64kbps.
    AUDIO_CODEC_PCMU = 1;

    // G.711 A-law, 8kHz/8-bit/64kbps.
    AUDIO_CODEC_PCMA = 3;

    // PCM 16-bit LE. sample_rate_hz required.
    AUDIO_CODEC_L16LE = 4;
  }

  // Codec for audio frames.
  AudioCodec codec = 1 [(buf.validate.field).enum.defined_only = true];

  // Sample rate in Hz. Required for L16LE, not required for PCMU/PCMA.
  int32 sample_rate_hz = 2;

  // Packet duration in ms (default 20).
  int32 ptime_ms = 3;
}
